{% for run in runs %}
<button type="button" class="history-item" hx-get="/runs/{{ run.id }}" hx-target="#response" hx-swap="innerHTML">{{ run.state.query }} <span class="history-meta">{{ run.status }} · {{ run.created_at }}</span></button>
{% else %}<p class="field-hint">No working runs yet. New requests checkpoint completed work here; reopening this list sends no model request.</p>{% endfor %}
