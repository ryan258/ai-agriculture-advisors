<label for="selected-excerpt">Review and shorten the supplied excerpt (maximum 12,000 characters)</label><textarea id="selected-excerpt" rows="8" maxlength="12000">{{ passage }}</textarea>
<button type="button" class="outline" data-add-excerpt="{{ label }}">Add this visible passage to task sources</button><p class="field-hint">Nothing is sent to a provider until you submit the task.</p>
