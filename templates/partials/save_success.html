<div class="{% if result_type == 'roundtable' %}roundtable-header{% else %}responses-header{% endif %}">
    <h2 id="{% if result_type == 'roundtable' %}roundtable-title{% else %}responses-title{% endif %}">{% if result_type == 'roundtable' %}Roundtable Discussion{% else %}Expert Responses{% endif %}</h2>
    <div class="query-display" aria-label="Current query">
        <strong>Query:</strong> {{ query }}
    </div>
    {% if result_type == 'roundtable' %}
    <div class="roundtable-meta">
        <span class="meta-item"><strong>Rounds:</strong> {{ rounds }}</span>
        <span class="meta-item"><strong>Participants:</strong> {{ num_experts }}</span>
    </div>
    {% endif %}
    {% include "partials/saved_actions.html" %}
</div>
