<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Advisors{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        window.addEventListener('error', function(event) {
            const failedAsset = event.filename || (event.target && event.target.src) || '';
            if (!failedAsset.includes('/static/')) return;
            window.advisorsControlFailure = true;
            const status = document.getElementById('dependency-status');
            if (status) status.textContent = 'A local browser control could not initialize. Your saved data is retained. Reload the page or restore its local static files; raw response text remains available.';
        }, true);
    </script>
    <script src="/static/vendor/htmx-1.9.12.min.js"></script>
    <script src="/static/vendor/marked-18.0.14.umd.js"></script>
    <script src="/static/vendor/purify-3.4.17.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <noscript><p class="card error-message">JavaScript is required for the local workbench controls. Saved records can still be exported through their known local URLs.</p></noscript>
    <p id="dependency-status" class="error-message" role="alert"></p>
    {% block content %}{% endblock %}

    <script>
        // Configure marked with safe options
        if (window.marked) marked.setOptions({
            breaks: true,
            gfm: true
        });

        // Sanitize and parse markdown
        function renderMarkdown(el) {
            const rawText = el.textContent;
            if (!window.marked || !window.DOMPurify) { el.classList.add('plain-response'); return; }
            try {
            const html = marked.parse(rawText);
            el.innerHTML = DOMPurify.sanitize(html, {
                ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'ul', 'ol', 'li', 'code', 'pre', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'a', 'hr', 'table', 'caption', 'thead', 'tbody', 'tr', 'th', 'td'],
                ALLOWED_ATTR: ['href', 'target', 'rel', 'scope', 'colspan', 'rowspan'],
                ALLOW_DATA_ATTR: false,
                ADD_ATTR: ['target'],
                FORBID_TAGS: ['script', 'style', 'iframe', 'form', 'input'],
                FORBID_ATTR: ['onerror', 'onclick', 'onload']
            });
            // Make links open in new tab safely
            el.querySelectorAll('a').forEach(a => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });
            } catch (_) {
                el.textContent = rawText;
                el.classList.add('plain-response');
                document.getElementById('dependency-status').textContent = 'This response could not be formatted. Its original text is preserved below; your saved data is retained.';
            }
        }

        // Parse markdown in response cards after HTMX swap
        document.body.addEventListener('htmx:afterSwap', function(event) {
            const target = event.detail.target;
            target.querySelectorAll('.markdown-content').forEach(renderMarkdown);
            const path = event.detail.requestConfig && event.detail.requestConfig.path || '';
            if (target.id === 'response' && !path.startsWith('/runs/')) {
                target.focus({preventScroll: true});
                target.scrollIntoView({block: 'start'});
            }
        });

        // Initial markdown parsing on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.htmx || !window.marked || !window.DOMPurify || window.advisorsControlFailure) {
                document.getElementById('dependency-status').textContent = 'A local browser library could not load. Your saved data is retained. Restart the app or restore its static/vendor files; raw response text remains readable.';
            }
            document.querySelectorAll('.markdown-content').forEach(renderMarkdown);
        });

    </script>
    <script src="/static/js/roundtable.js" defer></script>
    <script src="/static/js/workspace.js" defer></script>
    <script src="/static/js/note-drafts.js" defer></script>
    <script src="/static/js/workbench.js" defer></script>
</body>
</html>
